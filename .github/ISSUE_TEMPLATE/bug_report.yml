name: Bug report
description: Report a reproducible problem
title: "[Bug] <title>"
body:
  - type: markdown
    attributes:
      value: |
        Please reproduce the issue with the latest build and include the relevant configuration and logs.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: SUB-CVT v0.1.0
    validations:
      required: true
  - type: input
    id: conversion
    attributes:
      label: Conversion
      placeholder: Source format to target format
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and configuration
      render: shell
    validations:
      required: false
